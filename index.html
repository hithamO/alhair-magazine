<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>نشرة مدرسة الهير 2026 – 2027</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet"><style id="mag-css">:root{--green:#0A5E4C;--deep:#0B3E3A;--gold:#B8862B;--red:#C8102E;--blue:#1F5E8C;--sky:#DCE8EE;--quote:#F3EEE3;--paper:#FFFFFF;--pagebg:#F8F9F6;--ink:#1D2A28;--muted:#5B6C68;
--back:#D5E2DC;--back2:#C3D5CD;--chrome:#0B3E3A;--chrome-soft:rgba(11,62,58,.08);--chrome-line:rgba(11,62,58,.16);--chrome-ink:#0B3E3A;--kufi:"Noto Kufi Arabic",Tahoma,"Segoe UI",Arial,sans-serif;--naskh:"Noto Naskh Arabic","Traditional Arabic",Tahoma,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--back:#0D2522;--back2:#12302C;--chrome:#E4EFEA;--chrome-soft:rgba(255,255,255,.07);--chrome-line:rgba(255,255,255,.14);--chrome-ink:#E4EFEA}}
:root[data-theme="dark"]{--back:#0D2522;--back2:#12302C;--chrome:#E4EFEA;--chrome-soft:rgba(255,255,255,.07);--chrome-line:rgba(255,255,255,.14);--chrome-ink:#E4EFEA}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:radial-gradient(120% 90% at 50% 40%,var(--back) 0%,var(--back2) 100%);color:var(--chrome-ink);font-family:var(--kufi);overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
/* top bar */
.bar{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;flex:none}
.bar h1{font-size:1rem;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chrome)}
.bar h1 small{font-weight:500;opacity:.7;margin-inline-start:.4rem;font-size:.85em}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--chrome-line);background:var(--chrome-soft);border-radius:999px;padding:.45rem .85rem;font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--chrome)}
.btn:hover{background:var(--chrome-line)}
.btn:focus-visible,.navb:focus-visible,.thumb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn svg,.navb svg{width:1.1em;height:1.1em;flex:none}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn[hidden]{display:none}
.btn .lbl{display:inline}
/* stage */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.5rem 1rem;position:relative;perspective:2200px}
.spread{display:flex;flex-direction:row;filter:drop-shadow(0 18px 30px rgba(0,0,0,.28))}
.pw{container-type:inline-size;width:var(--pw,480px);height:calc(var(--pw,480px)*1.4143);position:relative}
.spread.two .pw:first-child .page{border-radius:0 .5cqw .5cqw 0}
.spread.two .pw:last-child .page{border-radius:.5cqw 0 0 .5cqw}
.spread.two .pw:first-child::after{content:"";position:absolute;inset:0 auto 0 0;width:6%;background:linear-gradient(to right,rgba(0,0,0,.14),transparent);pointer-events:none}
.spread.two .pw:last-child::after{content:"";position:absolute;inset:0 0 0 auto;width:6%;background:linear-gradient(to left,rgba(0,0,0,.14),transparent);pointer-events:none}
.pw.blank{visibility:hidden}
.anim-next{animation:inNext .45s cubic-bezier(.2,.7,.2,1)}
.anim-prev{animation:inPrev .45s cubic-bezier(.2,.7,.2,1)}
@keyframes inNext{from{opacity:0;transform:translateX(-40px) rotateY(-8deg)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(40px) rotateY(8deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim-next,.anim-prev{animation:none}}
/* bottom nav */
.nav{flex:none;display:flex;align-items:center;justify-content:center;gap:1rem;padding:.55rem 1rem .8rem}
.navb{width:2.8rem;height:2.8rem;border-radius:50%;border:1px solid var(--chrome-line);background:var(--chrome-soft);display:grid;place-items:center;cursor:pointer;color:var(--chrome)}
.navb:hover:not(:disabled){background:var(--green);color:#fff;border-color:var(--green)}
.navb:disabled{opacity:.35;cursor:default}
.pos{min-width:9rem;text-align:center;font-size:.9rem;color:var(--chrome)}
.pos input{width:100%;accent-color:var(--green);display:block;margin-top:.25rem}

/* ============ PAGE ============ */
.page{position:absolute;inset:0;background:var(--pagebg);color:var(--ink);font-size:2.45cqw;display:flex;flex-direction:column;overflow:hidden;font-family:var(--naskh);line-height:1.75}
.page.img-page{background:#fff}
.page.img-page>.slot{position:absolute;inset:0;border-radius:0;border:0;height:100%;aspect-ratio:auto}
.page.img-page>.slot img{object-fit:cover}
.run{display:flex;justify-content:space-between;align-items:center;padding:1.1em 1.6em .5em;font-family:var(--kufi);font-size:.72em;color:var(--muted);flex:none}
.run span{display:inline-flex;align-items:center;gap:.5em}
.run .flag{width:1.9em;height:.95em;display:block;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.15)}
.band{display:flex;align-items:center;margin:.4em 1.6em .9em;flex:none}
.band .ico{width:3.1em;height:3.1em;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;flex:none;position:relative;z-index:1;box-shadow:0 0 0 .3em var(--pagebg)}
.band .ico svg{width:1.45em;height:1.45em}
.band h2{flex:1;margin:0 -1.2em 0 0;padding:.45em 1.8em .5em 1em;background:var(--green);color:#fff;font-family:var(--kufi);font-weight:700;font-size:1.3em;line-height:1.4;border-radius:0 .6em .6em 0;text-align:center}
.body{flex:1;min-height:0;overflow:auto;padding:0 1.6em .8em;display:flex;flex-direction:column;gap:.9em;scrollbar-width:thin}
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;background:var(--green);color:#fff;font-family:var(--kufi);font-size:.72em;padding:.7em 1.9em;position:relative}
.foot::before{content:"";position:absolute;inset:-.35em 0 auto 0;height:.35em;background:linear-gradient(to left,var(--red) 0 25%,var(--green) 25% 50%,#fff 50% 75%,#111 75%)}
.foot .num{font-weight:700;font-size:1.15em}
/* building blocks */
.slot{margin:0;position:relative;border-radius:.9em;overflow:hidden;background:var(--sky);border:1px solid rgba(11,62,58,.08);aspect-ratio:16/10;width:100%}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;color:#7C949A;font-family:var(--kufi);font-size:.8em;text-align:center;padding:.5em;background-image:repeating-linear-gradient(135deg,transparent 0 .9em,rgba(255,255,255,.35) .9em 1.8em)}
.slot-empty svg{width:2em;height:2em;opacity:.7}
.slot-empty b{font-weight:500}
.card{background:#fff;border-radius:1em;box-shadow:0 .15em .6em rgba(11,62,58,.1);overflow:hidden;display:flex;flex-direction:column}
.card .slot{border-radius:0;border:0}
.card .cb{padding:.6em .8em .7em;display:flex;flex-direction:column;gap:.25em}
.pill{align-self:flex-start;background:var(--green);color:#fff;font-family:var(--kufi);font-weight:700;font-size:.82em;padding:.2em .8em;border-radius:.45em;line-height:1.6}
.pill.red{background:var(--red)}.pill.blue{background:var(--blue)}.pill.gold{background:var(--gold)}
.ttl{font-family:var(--kufi);font-weight:700;font-size:.95em;color:var(--deep);line-height:1.5}
.txt{font-size:.88em;color:var(--ink);white-space:pre-line}
.small{font-size:.8em;color:var(--muted)}
.prose{font-size:.95em;white-space:pre-line;text-align:justify}
.h3{font-family:var(--kufi);font-weight:700;color:var(--green);font-size:1.02em;line-height:1.5}
.sign{font-family:var(--kufi);font-weight:700;color:var(--deep);font-size:.9em;text-align:left}
.tag{text-align:center;font-family:var(--kufi);font-weight:800;color:var(--deep);font-size:1.2em;line-height:1.5;padding:.1em 0}
.quote{background:var(--quote);border-radius:1em;padding:1.1em 1.3em;position:relative;font-family:var(--kufi);font-weight:700;color:var(--deep);font-size:1.1em;line-height:1.75;display:flex;align-items:center;white-space:pre-line}
.quote::before,.quote::after{position:absolute;color:var(--gold);font-size:2.6em;line-height:1;font-family:Georgia,serif}
.quote::before{content:"\201C";top:.1em;right:.25em}
.quote::after{content:"\201D";bottom:-.35em;left:.25em}
.quote>div{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.9em}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.row{display:flex;gap:.9em;align-items:stretch}
.row>*{flex:1;min-width:0}
.tall{aspect-ratio:3/4}
.sq{aspect-ratio:1}
.chip{display:flex;gap:.6em;align-items:flex-start;background:#fff;border-radius:.8em;padding:.55em .7em;box-shadow:0 .1em .4em rgba(11,62,58,.09)}
.chip .ci{width:2.2em;height:2.2em;border-radius:50%;background:var(--sky);color:var(--green);display:grid;place-items:center;flex:none}
.chip .ci svg{width:1.2em;height:1.2em}
.chip>div{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:.6em}
.circ{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35em}
.circ .cc{width:4.2em;height:4.2em;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 .3em #fff,0 .3em .8em rgba(11,62,58,.25)}
.circ .cc svg{width:1.9em;height:1.9em}
.big-quote{font-size:1.3em;min-height:9em;justify-content:center;text-align:center;padding:1.8em 1.4em}
.wide{aspect-ratio:16/8}

/* ===== editing ===== */
body:not(.editing) .page [data-f]:empty{display:none}
body:not(.editing) .slot-empty b{display:none}
body.editing .page [data-f]{outline:1.5px dashed rgba(184,134,43,.55);outline-offset:.15em;border-radius:.2em;cursor:text;min-height:1.2em;min-width:2em}
body.editing .page .band h2[data-f]{outline-color:rgba(255,255,255,.6)}
body.editing .page [data-f]:focus{outline:2px solid var(--gold);background:rgba(184,134,43,.08)}
body.editing .page [data-f]:empty::before{content:attr(data-ph);color:#9AA8A5;font-weight:400}
body.editing .slot{cursor:pointer}
.slot-tools{display:none}
body.editing .slot-tools{display:flex;position:absolute;inset:auto .4em .4em auto;gap:.3em;z-index:2}
.slot-tools button{font-family:var(--kufi);font-size:max(.7em,11px);border:0;border-radius:.4em;padding:.25em .6em;background:rgba(11,62,58,.88);color:#fff;cursor:pointer}
.slot-tools button.del{background:rgba(200,16,46,.9)}
.page-tools{display:none}
body.editing .page-tools{display:flex;position:absolute;top:.4em;left:50%;transform:translateX(-50%);gap:.3em;z-index:3}
.page-tools button{font-family:var(--kufi);font-size:max(.68em,11px);border:0;border-radius:99px;padding:.3em .8em;background:rgba(11,62,58,.9);color:#fff;cursor:pointer;white-space:nowrap}
.page-tools button.danger{background:var(--red)}
.editbar{display:none;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.5rem 1rem;background:var(--gold);color:#fff;font-size:.85rem}
body.editing .editbar{display:flex}
.editbar .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.editbar .btn:hover{background:rgba(255,255,255,.3)}
.editbar .btn.save{background:#fff;color:var(--deep);font-weight:700}
.editbar .meter{opacity:.9;font-size:.8rem}
.editbar .hint{flex:1;min-width:12rem}
/* drawer */
.drawer{position:fixed;inset:0;z-index:20;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.drawer .panel{position:absolute;inset:0 0 0 auto;width:min(420px,92vw);background:var(--back);padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
.drawer h3{margin:0 0 .8rem;font-size:1rem;display:flex;justify-content:space-between;align-items:center;color:var(--chrome)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.thumb{border:0;padding:0;background:none;cursor:pointer;text-align:center;font-size:.75rem;color:var(--chrome)}
.thumb .pw{width:100%;height:auto;aspect-ratio:1/1.4143;border-radius:4px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.2);pointer-events:none}
.thumb.cur .pw{outline:3px solid var(--gold);outline-offset:2px}
.thumb span{display:block;margin-top:.35rem}
.thumb .page-tools,.thumb .slot-tools{display:none!important}
.thumb .page [data-f]{outline:none!important}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:.65rem 1.1rem;border-radius:.6rem;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== phone / narrow: one page, fixed readable type, vertical scroll ===== */
body.narrow{overflow:auto}
body.narrow #app{height:auto;min-height:100%}
body.narrow .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--back)}
body.narrow .bar .lbl{display:none}
body.narrow .stage{align-items:flex-start;padding:.3rem .6rem 1rem}
body.narrow .spread{filter:drop-shadow(0 8px 18px rgba(0,0,0,.22))}
body.narrow .stage .pw{height:auto;min-height:calc(var(--pw)*1.4143)}
body.narrow .stage .page{position:relative;min-height:calc(var(--pw)*1.4143);font-size:15.5px;border-radius:6px}
body.narrow .stage .body{overflow:visible}
body.narrow .stage .page.img-page{min-height:calc(var(--pw)*1.4143)}
body.narrow .nav{position:sticky;bottom:0;background:var(--back);z-index:5;padding-bottom:calc(.7rem + env(safe-area-inset-bottom,0px))}
@media (max-width:420px){body.narrow .stage .g3{grid-template-columns:1fr 1fr}.bar{padding:.5rem .6rem}}
.panel.dlg{width:min(440px,94vw)}
.dlg .note{font-size:.85rem;line-height:1.8;margin:0 0 1rem;color:var(--chrome);opacity:.85}
.dlg label{display:block;font-size:.85rem;margin-bottom:.8rem;color:var(--chrome)}
.dlg input{display:block;width:100%;margin-top:.3rem;padding:.6rem .7rem;border-radius:.5rem;border:1px solid var(--chrome-line);background:#fff;color:#1D2A28;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;text-align:left}
.dlg input:focus{outline:3px solid var(--gold);outline-offset:1px}
.dlg-actions{display:flex;flex-direction:column;gap:.5rem;margin-top:1.2rem}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function getP(o,path){return path.split(".").reduce(function(a,k){return a==null?a:a[k];},o);}
function setP(o,path,v){var ks=path.split(".");var last=ks.pop();var t=ks.reduce(function(a,k){return a[k];},o);t[last]=v;}

 if(p.type==="image") return '<article class="page img-page" data-pi="'+pi+'">'+R.image(p)+tools+'</article>';

/* ---------- spreads ---------- */
var narrow=false,spreads=[],si=0,editing=false,dirty=false,CAN_EDIT=/edit/i.test(location.hash+location.search);
function buildSpreads(){var N=DATA.pages.length;spreads=[];
 if(narrow){for(var i=0;i<N;i++)spreads.push([i]);return;}
 spreads.push([0]);var i2=1;while(i2<N-1){if(i2+1<N-1){spreads.push([i2,i2+1]);i2+=2;}else{spreads.push([i2]);i2++;}}
 if(N>1)spreads.push([N-1]);}
function spreadOf(pi){for(var k=0;k<spreads.length;k++)if(spreads[k].indexOf(pi)>=0)return k;return 0;}
function fit(){
 var w=innerWidth,h=innerHeight;var wasN=narrow;narrow=w<760||(w<1000&&h>w*1.1);
 document.body.classList.toggle("narrow",narrow);
 var pw;if(narrow){pw=Math.min(w-16,620);}else{var bar=document.querySelector(".bar").offsetHeight,nav=document.querySelector(".nav").offsetHeight,eb=editing?document.querySelector(".editbar").offsetHeight:0;
  var avH=h-bar-nav-eb-24;pw=Math.floor(Math.min(avH/1.4143,(w-48)/2));}
 document.documentElement.style.setProperty("--pw",pw+"px");
 if(wasN!==narrow){var cur=spreads.length?spreads[si][0]:0;buildSpreads();si=spreadOf(cur);render(0);}
}
function render(dir){
 var st=document.getElementById("stage");var s=spreads[si]||[0];var two=!narrow&&(si>0&&si<spreads.length-1);
 var html='<div class="spread'+(two?" two":"")+(dir>0?" anim-next":dir<0?" anim-prev":"")+'">';
 s.forEach(function(pi){html+='<div class="pw">'+pageHTML(pi)+'</div>';});
 if(two&&s.length===1)html+='<div class="pw blank"></div>';
 st.innerHTML=html+'</div>';
 if(editing)armEditable(st);
 var N=DATA.pages.length;var a=s[0]+1,b=s[s.length-1]+1;
 document.getElementById("posTxt").textContent=(a===b?"صفحة "+a:"صفحات "+a+"–"+b)+" من "+N;
 var rg=document.getElementById("posRange");rg.max=spreads.length-1;rg.value=si;
 document.getElementById("prevB").disabled=si===0;document.getElementById("nextB").disabled=si>=spreads.length-1;
 if(narrow&&dir)window.scrollTo(0,0);
}
function go(d){var n=si+d;if(n<0||n>=spreads.length)return;si=n;render(d);}
function goPage(pi){si=spreadOf(pi);render(0);}

function meter(){var mb=(new Blob([JSON.stringify(DATA)]).size/1048576);$("meter").textContent="الحجم: "+mb.toFixed(1)+" ميغابايت";return mb;}
function setEditing(on){editing=on;document.body.classList.toggle("editing",on);$("editB").hidden=on||!CAN_EDIT;if(on){SNAP=JSON.stringify(DATA);meter();}render(0);fit();}
$("editB").onclick=function(){setEditing(true);toast("وضع التعديل مفعّل — التغييرات لا تظهر للزوار حتى تضغط «حفظ ونشر».",4000);};
$("cancelB").onclick=function(){if(dirty){DATA=JSON.parse(SNAP);dirty=false;buildSpreads();si=Math.min(si,spreads.length-1);}setEditing(false);};
$("stage").addEventListener("input",function(e){var el=e.target.closest("[data-f]");if(!el)return;var k=el.dataset.f.split("|");var v=el.innerText.replace(/\u00a0/g," ");if(el.classList.contains("one"))v=v.replace(/\n+/g," ");if(!v.trim()){v="";el.innerHTML="";}setP(DATA.pages[+k[0]],k[1],v);dirty=true;});
$("stage").addEventListener("keydown",function(e){var el=e.target.closest&&e.target.closest("[data-f].one");if(el&&e.key==="Enter"){e.preventDefault();el.blur();}});
$("stage").addEventListener("paste",function(e){var el=e.target.closest("[data-f]");if(!el||el.contentEditable==="plaintext-only")return;e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData("text");document.execCommand("insertText",false,t);});
var pickTarget=null;
$("stage").addEventListener("click",function(e){
 if(!editing)return;
 var btn=e.target.closest("[data-act]");var slot=e.target.closest(".slot");var pg=e.target.closest(".page");
 if(btn&&btn.dataset.act==="rmimg"){var k=slot.dataset.img.split("|");setP(DATA.pages[+k[0]],k[1],"");dirty=true;meter();render(0);return;}
 if(btn&&btn.dataset.act==="delpage"){if(btn.dataset.armed){var pi=+pg.dataset.pi;DATA.pages.splice(pi,1);dirty=true;buildSpreads();si=Math.min(spreadOf(Math.max(0,pi-1)),spreads.length-1);meter();render(0);toast("تم حذف الصفحة");}else{btn.dataset.armed=1;btn.textContent="اضغط مرة أخرى للتأكيد";setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent="حذف الصفحة";}},3000);}return;}
 if(btn&&(btn.dataset.act==="mvR"||btn.dataset.act==="mvL")){var a=+pg.dataset.pi,b=btn.dataset.act==="mvR"?a-1:a+1;var t=DATA.pages[a];DATA.pages[a]=DATA.pages[b];DATA.pages[b]=t;dirty=true;buildSpreads();si=spreadOf(b);render(0);return;}
 if(slot){pickTarget=slot.dataset.img;$("fileIn").value="";$("fileIn").click();}
});
$("fileIn").onchange=function(){var f=this.files&&this.files[0];if(!f||!pickTarget)return;var tgt=pickTarget;toast("جارٍ تجهيز الصورة…");
 compress(f).then(function(url){var k=tgt.split("|");setP(DATA.pages[+k[0]],k[1],url);dirty=true;var mb=meter();render(0);toast(mb>20?"تمت إضافة الصورة — اقتربت النشرة من الحد الأقصى للحجم.":"تمت إضافة الصورة");}).catch(function(){toast("تعذّر فتح هذه الصورة. جرّب صورة بصيغة JPG أو PNG.");});};
function compress(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file);var im=new Image();im.onload=function(){var max=1400,w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8));};im.onerror=function(){URL.revokeObjectURL(u);rej();};im.src=u;});}
$("addB").onclick=function(){var s=spreads[si];var at=Math.min(Math.max(s[s.length-1]+1,1),DATA.pages.length-1);DATA.pages.splice(at,0,{type:"article",title:"",heading:"",img:"",body:"",sign:""});dirty=true;buildSpreads();si=spreadOf(at);render(1);meter();toast("أُضيفت صفحة جديدة — اكتب عنوانها ونصها.");};

function buildDoc(){
 var css=$("mag-css").textContent,js=$("mag-js").textContent;
 var json=JSON.stringify(DATA).replace(/</g,"\\u003c");
 var S="<"+"/script>";
 return '<!doctype html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(DATA.meta.title)+' '+esc(DATA.meta.year)+'</title>'+
 '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">'+
 '<style id="mag-css">'+css+'</style></head><body><div id="app"></div><script type="application/json" id="mag-data">'+json+S+'<script id="mag-js">'+js+S+'</body></html>';
}
var saving=false,GHK="mag-github";
function ghGet(){try{return JSON.parse(localStorage.getItem(GHK)||"null");}catch(e){return null;}}
function ghSet(v){try{v?localStorage.setItem(GHK,JSON.stringify(v)):localStorage.removeItem(GHK);return true;}catch(e){return false;}}
function guessRepo(){var h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/i);if(!m)return {};var seg=location.pathname.split("/").filter(Boolean)[0];return {owner:m[1],repo:seg&&!/\.html?$/i.test(seg)?seg:h};}
function openGh(){var c=ghGet()||{},g=guessRepo();$("ghOwner").value=c.owner||g.owner||"";$("ghRepo").value=c.repo||g.repo||"";$("ghBranch").value=c.branch||"main";$("ghPath").value=c.path||"index.html";$("ghToken").value=c.token||"";$("ghDlg").classList.add("open");setTimeout(function(){(c.token?$("ghSave"):$("ghOwner")).focus();},50);}
$("ghB").onclick=openGh;
$("ghDlg").addEventListener("click",function(e){if(e.target.closest("[data-close]"))$("ghDlg").classList.remove("open");});
$("ghForget").onclick=function(){ghSet(null);$("ghToken").value="";toast("أُزيل الربط من هذا الجهاز.");};
$("ghSave").onclick=function(){var v={owner:$("ghOwner").value.trim(),repo:$("ghRepo").value.trim(),branch:$("ghBranch").value.trim()||"main",path:$("ghPath").value.trim().replace(/^\/+/,"")||"index.html",token:$("ghToken").value.trim()};
 if(!v.owner||!v.repo||!v.token){toast("أكمل اسم المستخدم واسم المستودع والرمز.");return;}
 ghSet(v);$("ghDlg").classList.remove("open");doSave();};
function b64utf8(str){var bytes=new TextEncoder().encode(str),bin="",CH=0x8000;for(var i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}
function api(c,method,body){var url="https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+c.path.split("/").map(encodeURIComponent).join("/")+(method==="GET"?"?ref="+encodeURIComponent(c.branch):"");
 return fetch(url,{method:method,headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github.object+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});}
function setSaveLbl(t){$("saveB").lastChild.textContent=t;}
function doSave(){var c=ghGet();if(!c||!c.token){openGh();return;}
 if(saving)return;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 if(meter()>25){toast("حجم النشرة كبير جدًا. احذف بعض الصور ثم احفظ.",4000);return;}
 saving=true;setSaveLbl("جارٍ النشر…");var html=buildDoc();
 api(c,"GET").then(function(r){if(r.status===404)return null;if(!r.ok)throw r;return r.json();}).then(function(j){
  return api(c,"PUT",{message:"تحديث النشرة "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64utf8(html),branch:c.branch,sha:j&&j.sha?j.sha:undefined});
 }).then(function(r){if(!r.ok)throw r;return r.json();}).then(function(){saving=false;dirty=false;SNAP=JSON.stringify(DATA);setSaveLbl("حفظ ونشر");toast("تم النشر ✓ سيظهر التحديث على الموقع خلال دقيقة أو دقيقتين.",5000);})
 .catch(function(r){saving=false;setSaveLbl("حفظ ونشر");var st=r&&r.status;
  if(st===401)toast("الرمز (Token) غير صحيح أو انتهت صلاحيته. افتح «الربط» وأدخل رمزًا جديدًا.",6000);
  else if(st===403)toast("الرمز لا يملك صلاحية الكتابة. فعّل صلاحية Contents: Read and write لمستودع النشرة.",6500);
  else if(st===404)toast("لم يُعثر على المستودع. تأكد من اسم المستخدم واسم المستودع في «الربط».",6000);
  else if(st===409||st===422)toast("تغيّر الملف على GitHub أثناء الحفظ. اضغط «حفظ ونشر» مرة أخرى.",6000);
  else toast("تعذّر الاتصال بـ GitHub. تأكد من الإنترنت ثم حاول مرة أخرى، أو استخدم «تنزيل نسخة».",6500);});}
$("saveB").onclick=doSave;
$("dlB").onclick=function(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();var blob=new Blob([buildDoc()],{type:"text/html"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);toast("تم تنزيل index.html — ارفعه مكان الملف القديم على الموقع.",5000);};
window.addEventListener("beforeunload",function(e){if(dirty&&!saving){e.preventDefault();e.returnValue="";}});

/* ---------- boot ---------- */
buildSpreads();fit();render(0);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(fit,80);});
function syncEditFlag(){CAN_EDIT=CAN_EDIT||/edit/i.test(location.hash+location.search);$("editB").hidden=editing||!CAN_EDIT;}
window.addEventListener("hashchange",function(){syncEditFlag();if(CAN_EDIT&&!editing)setEditing(true);});
syncEditFlag();
})();
</script></body></html>
